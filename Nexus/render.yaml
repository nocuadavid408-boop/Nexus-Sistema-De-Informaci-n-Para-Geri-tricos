services:
  - type: web
    name: nexus
    runtime: docker
    plan: free
    envVars:
      - key: TZ
        value: America/Bogota
      - key: NEXUS_SECRET_KEY
        generateValue: true
      - key: NEXUS_DB_HOST
        value: mysql-293d14ed-nocuadavid408-c1f7.e.aivencloud.com
      - key: NEXUS_DB_PORT
        value: "18356"
      - key: NEXUS_DB_USER
        value: avnadmin
      - key: NEXUS_DB_PASSWORD
        sync: false
      - key: NEXUS_DB_NAME
        value: defaultdb
      - key: NEXUS_DB_SSL_CA
        value: /app/database/ca.pem
